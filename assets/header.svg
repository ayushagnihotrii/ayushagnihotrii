<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C10" />
      <stop offset="50%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0A0710" />
    </linearGradient>

    <!-- Flame & Sunset Gradients -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D4EDD" />
      <stop offset="35%" stop-color="#FF0055" />
      <stop offset="70%" stop-color="#FF5400" />
      <stop offset="100%" stop-color="#FFB703" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0055" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF5400" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFB703" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFF0F5" />
      <stop offset="65%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>

    <filter id="intenseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FF5400" stroke-width="0.75" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" fill="url(#bgGrad)" rx="10" />
  <rect width="1200" height="240" fill="url(#cyberGrid)" rx="10" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="40" r="160" fill="#9D4EDD" opacity="0.12" filter="url(#intenseGlow)" />
  <circle cx="1050" cy="180" r="180" fill="#FF5400" opacity="0.12" filter="url(#intenseGlow)" />

  <!-- Corner Tech HUD Accents -->
  <path d="M 25,50 L 25,25 L 50,25" fill="none" stroke="#FF5400" stroke-width="2.5" opacity="0.6" />
  <path d="M 1175,50 L 1175,25 L 1150,25" fill="none" stroke="#FF5400" stroke-width="2.5" opacity="0.6" />
  <path d="M 25,190 L 25,215 L 50,215" fill="none" stroke="#9D4EDD" stroke-width="2.5" opacity="0.6" />
  <path d="M 1175,190 L 1175,215 L 1150,215" fill="none" stroke="#9D4EDD" stroke-width="2.5" opacity="0.6" />

  <!-- Top Status Badge -->
  <g transform="translate(600, 36)" text-anchor="middle">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#1A1F2C" stroke="#FF5400" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="-112" cy="0" r="4" fill="#00FF66">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-95" y="4" font-family="'Fira Code', monospace, sans-serif" font-size="11" font-weight="600" fill="#FFB703" letter-spacing="1.5" text-anchor="start">SYSTEM_ACTIVE // ONLINE</text>
  </g>

  <!-- Main Name Title -->
  <text x="600" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="4" fill="url(#textGrad)" filter="url(#intenseGlow)">AYUSH AGNIHOTRI</text>

  <!-- Subtitle -->
  <text x="600" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="2.5" fill="#E2E8F0">FULL-STACK DEVELOPER  •  AUTOMATION ARCHITECT  •  SECURITY</text>

  <!-- Dynamic Cyber Slash Bottom Accents -->
  <path d="M 0,225 L 300,225 L 340,240 L 0,240 Z" fill="#9D4EDD" opacity="0.7" />
  <path d="M 280,228 L 560,228 L 590,240 L 320,240 Z" fill="#FF0055" opacity="0.85" />
  <path d="M 540,230 L 880,230 L 910,240 L 570,240 Z" fill="#FF5400" opacity="0.9" />
  <path d="M 860,228 L 1200,228 L 1200,240 L 890,240 Z" fill="#FFB703" opacity="0.85" />

  <!-- Bottom Glowing Thin Cyber Border -->
  <line x1="0" y1="228" x2="1200" y2="228" stroke="url(#flameGrad)" stroke-width="2.5" filter="url(#intenseGlow)" />
</svg>
